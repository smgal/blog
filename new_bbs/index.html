<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익명 게시판</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="board">
        <div class="notice">
            <p><strong>공지:</strong> 이 게시판은 익명으로 운영됩니다. (아직 제작 중입니다)</p>
        </div>

        <form id="post-form" class="post-form">
            <div class="form-row">
                <input type="text" id="post-author" placeholder="이름">
                <input type="email" id="post-email" placeholder="e-mail">
            </div>
            <div class="form-row password-row">
                <input type="password" id="post-password" placeholder="비밀번호" autocomplete="new-password">
                <span class="password-notice">(선택) 비밀번호 설정 시 글을 삭제할 수 있습니다.</span>
            </div>
            <div class="form-row">
                <input type="text" id="post-homepage" placeholder="홈페이지">
            </div>
            <div class="form-row">
                <input type="text" id="post-title" placeholder="제목">
            </div>
            <textarea id="post-content" placeholder="내용을 입력하세요..."></textarea>
            <button type="submit" id="submit-post">글쓰기</button>
        </form>

        <div id="pagination-top" class="pagination"></div>

        <div id="posts-container">
            <!-- 게시글이 여기에 동적으로 추가됩니다. -->
        </div>

        <div id="pagination-bottom" class="pagination"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
